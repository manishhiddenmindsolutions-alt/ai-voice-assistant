
services:
  db:
    image: postgres:15-alpine
    container_name: voice-forge-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Voice-Agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Voice-Agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-forge-app
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/Voice-Agent
      - ENABLE_BACKGROUND_AGENT=true
      - PORT=8000
    volumes:
      - app_data:/app/data

volumes:
  postgres_data:
  app_data:
